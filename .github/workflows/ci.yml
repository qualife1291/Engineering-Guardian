name: Engineering Guardian CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile (no dependency installation)
        run: python -m compileall -q ucg scripts benchmarks tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: CLI self-check
        run: |
          python -m ucg.cli --root . status
          python -m ucg.cli --root ./tests scan
          python -m ucg.cli --root ./tests overview
      - name: Check version and documentation consistency
        run: |
          python - <<'PY'
          import pathlib, tomllib
          from ucg import __version__
          pkg = tomllib.loads(pathlib.Path('pyproject.toml').read_text())
          assert pkg['project']['version'] == __version__
          assert f'## [{__version__}]' in pathlib.Path('CHANGELOG.md').read_text()
          for name in ('AGENTS.md','CLAUDE.md','SECURITY.md','CONTRIBUTING.md','docs/CLAUDE_CODE.md','docs/DIAGNOSTICS.md'):
              assert pathlib.Path(name).is_file(), name
          print('Version and docs OK')
          PY
      - name: Smoke support log
        run: |
          python -m ucg.cli --root ./tests log-summary > /tmp/guardian-summary.json
          python -m ucg.cli --root ./tests support-bundle > /tmp/guardian-bundle.json
      - name: Verify sensitive files excluded
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"

  windows:
    name: Windows native (Python 3.11, PowerShell)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python
        run: python -m compileall -q ucg scripts benchmarks tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Windows PowerShell parse and bootstrap
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $scripts = @('scripts/windows_common.ps1', 'scripts/connect_claude.ps1', 'scripts/start_windows.ps1')
          foreach ($p in $scripts) {
            $tokens = $null
            $syntaxErrors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path -LiteralPath $p).Path, [ref]$tokens, [ref]$syntaxErrors)
            if ($syntaxErrors.Count -gt 0) { throw "PowerShell parse failed for $p : $syntaxErrors" }
          }
          & .\scripts\start_windows.ps1 -CheckOnly
      - name: Mocked Claude Code project registration (spaces in path)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $fixture = Join-Path $env:RUNNER_TEMP 'Guardian Test Source With Spaces'
          New-Item -ItemType Directory -Path $fixture -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $fixture 'fixture.py') -Value "def hello(): return 1"
          function global:claude {
            if ($args.Count -ge 2 -and $args[1] -eq 'add') {
              $global:registeredArgs = @($args)
            }
            $global:LASTEXITCODE = 0
          }
          & .\scripts\connect_claude.ps1 -ProjectPath $fixture -Yes
          if (-not $global:registeredArgs) { throw 'No MCP registration attempted.' }
          $rootIndex = [Array]::IndexOf($global:registeredArgs, '--root')
          if ($rootIndex -lt 0 -or $global:registeredArgs[$rootIndex+1] -ne $fixture) {
            throw 'Quoted project root was not passed intact.'
          }
          Write-Host 'Windows MCP registration: PASS (mocked Claude command)'
      - name: Version and docs smoke
        shell: pwsh
        run: |
          python -c "import pathlib, tomllib, ucg; assert tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'] == ucg.__version__"
          python -m ucg.cli --root ./tests scan
          if ($LASTEXITCODE -ne 0) { throw 'Windows CLI smoke failed.' }
