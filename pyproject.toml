[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "engineering-guardian-ucg-poc"
version = "0.5.0"
description = "Offline codebase navigation, versioned UCG, optional MCP for AI agents, local diagnostics"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
treesitter = [
    "tree-sitter>=0.25.1,<0.26",
    "tree-sitter-language-pack==1.24.0",
]

[project.scripts]
guardian = "ucg.cli:main"
guardian-mcp = "ucg.mcp:main"
ucg = "ucg.cli:main"

[tool.setuptools.packages.find]
include = ["ucg*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
